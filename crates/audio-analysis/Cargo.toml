[package]
name = "audio-analysis"
version = "0.1.0"
edition = "2021"
license = "MIT AND BSD-2-Clause"
description = "Bounded offline tempo, tonal key and frequency-band waveform analysis"

[dependencies]
serde = { version = "1", features = ["derive"] }
rustfft = "6.4.1"
beat-this = { version = "=1.1.0", default-features = false }
anyhow = "1"
rten = { version = "=0.24.0", features = ["fft"] }
rten-tensor = "=0.24.0"
sha2 = "0.10"

[dev-dependencies]
serde_json = "1"
