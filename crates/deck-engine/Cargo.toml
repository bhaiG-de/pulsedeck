[package]
name = "deck-engine"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
schemars = "0.8.22"
serde = { version = "1", features = ["derive"] }
# Cache dependencies include exact BPM/grid bits; parsing saved JSON must retain them.
serde_json = { version = "1", features = ["float_roundtrip"] }
symphonia = { version = "0.5", features = ["all"] }
# This generic-tag API retains unknown/custom keys across metadata formats.
lofty = "0.22.4"
cpal = "0.15.3"
rtrb = "0.3"
audio-analysis = { path = "../audio-analysis" }

[build-dependencies]
cc = "1"
