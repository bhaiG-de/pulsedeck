[package]
name = "spotify-playback"
version = "0.1.0"
edition = "2021"
description = "Experimental isolated Spotify playback PCM adapter"

[dependencies]
librespot-core = { version = "=0.8.0", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-playback = { version = "=0.8.0", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-metadata = { version = "=0.8.0", default-features = false, features = ["rustls-tls-webpki-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync"] }
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
log = "0.4"

# librespot 0.8's vergen-gitcl 1.x uses vergen-lib 0.1.x; vergen 9.1's
# incompatible trait dependency breaks that upstream build script. Match the
# upstream reviewed Cargo.lock, without modifying librespot source.
[build-dependencies]
vergen = { version = "=9.0.6", default-features = false }
