[workspace]
members = ["crates/deck-engine", "crates/flx4-midi", "crates/audio-analysis", "crates/spotify-playback", "crates/control-protocol", "crates/pulsedeck-cli", "src-tauri"]
resolver = "2"
exclude = ["vendor/cpal"]

[patch.crates-io]
cpal = { path = "vendor/cpal" }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

# The beat model is unusably slow unoptimized; keep its numeric crates fast in
# tests and dev builds.
[profile.dev.package.audio-analysis]
opt-level = 3
[profile.dev.package.tract-core]
opt-level = 3
[profile.dev.package.tract-data]
opt-level = 3
[profile.dev.package.tract-linalg]
opt-level = 3
[profile.dev.package.rubato]
opt-level = 3
[profile.dev.package.rustfft]
opt-level = 3
