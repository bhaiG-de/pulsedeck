[workspace]
members = ["crates/deck-engine", "crates/flx4-midi", "crates/audio-analysis", "crates/spotify-playback", "crates/control-protocol", "crates/pulsedeck-cli", "src-tauri"]
resolver = "2"
exclude = ["vendor/cpal"]

[patch.crates-io]
cpal = { path = "vendor/cpal" }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

# Keep offline neural inference practical in desktop development builds.
[profile.dev.package.beat-this]
opt-level = 3
[profile.dev.package.rten]
opt-level = 3
[profile.dev.package.rten-tensor]
opt-level = 3
[profile.dev.package.rten-gemm]
opt-level = 3
[profile.dev.package.rten-vecmath]
opt-level = 3
[profile.dev.package.rten-simd]
opt-level = 3
[profile.dev.package.rten-base]
opt-level = 3
[profile.dev.package.rayon]
opt-level = 3
[profile.dev.package.rayon-core]
opt-level = 3
[profile.dev.package.rubato]
opt-level = 3
[profile.dev.package.realfft]
opt-level = 3
[profile.dev.package.rustfft]
opt-level = 3
[profile.dev.package.audio-analysis]
opt-level = 3
[profile.dev.package.ebur128]
opt-level = 3

# Native rendering must meet device deadlines in development builds too.
[profile.dev.package.deck-engine]
opt-level = 3

# File decoding runs before a local deck can play; keep codecs optimized in
# development bundles as well as the engine and analysis workers.
[profile.dev.package.symphonia]
opt-level = 3
[profile.dev.package.symphonia-bundle-flac]
opt-level = 3
[profile.dev.package.symphonia-bundle-mp3]
opt-level = 3
[profile.dev.package.symphonia-codec-aac]
opt-level = 3
[profile.dev.package.symphonia-codec-adpcm]
opt-level = 3
[profile.dev.package.symphonia-codec-alac]
opt-level = 3
[profile.dev.package.symphonia-codec-pcm]
opt-level = 3
[profile.dev.package.symphonia-codec-vorbis]
opt-level = 3
[profile.dev.package.symphonia-core]
opt-level = 3
[profile.dev.package.symphonia-format-caf]
opt-level = 3
[profile.dev.package.symphonia-format-isomp4]
opt-level = 3
[profile.dev.package.symphonia-format-mkv]
opt-level = 3
[profile.dev.package.symphonia-format-ogg]
opt-level = 3
[profile.dev.package.symphonia-format-riff]
opt-level = 3
[profile.dev.package.symphonia-metadata]
opt-level = 3
[profile.dev.package.symphonia-utils-xiph]
opt-level = 3

# A content check must not dominate cached deck loads in a development bundle.
[profile.dev.package.sha2]
opt-level = 3

# Cover thumbnails are decoded off-thread when visible, including in dev apps.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.moxcms]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3

# Library queries should use the same optimized SQLite in development as release.
[profile.dev.package.libsqlite3-sys]
opt-level = 3
