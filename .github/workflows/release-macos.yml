name: macOS ZIP release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: macos-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      CARGO_BUILD_JOBS: '2'
      APPLE_SIGNING_IDENTITY: '-'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy --component rustfmt
      - name: Check tag matches app version
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          version = json.loads(Path('src-tauri/tauri.conf.json').read_text())['version']
          assert os.environ['RELEASE_TAG'] == 'v' + version, 'Tag must match tauri.conf.json version'
          assert json.loads(Path('package.json').read_text())['version'] == version
          lock = json.loads(Path('package-lock.json').read_text())
          assert lock['version'] == lock['packages']['']['version'] == version
          assert re.search(r'^version = "' + re.escape(version) + r'"$', Path('src-tauri/Cargo.toml').read_text(), re.M)
          PY
      - name: Install dependencies
        run: |
          npm ci
          npm --prefix frontend ci
      - name: Install verified analysis assets
        run: python3 tools/ensure-beat-models.py
      - name: Run regression checks
        run: |
          cargo fmt --all --check
          cargo test --workspace -- --skip library::tests::browser_pages_filter_and_sort_in_sql_without_reading_large_analysis_or_cues
          cargo clippy --workspace --all-targets -- -D warnings
          npm --prefix frontend test
          python3 tools/check-control-coverage.py
          python3 tools/validate-dj-skills.py
          python3 tools/test-dj-skill-packaging.py
          python3 tools/test-agent-plugin.py
          python3 tools/test-dj-offline-evidence.py
      # Shared runners cannot enforce a machine-specific wall-clock budget.
      - name: Report large-library latency
        continue-on-error: true
        run: cargo test -p pulsedeck library::tests::browser_pages_filter_and_sort_in_sql_without_reading_large_analysis_or_cues -- --test-threads=1
      - name: Build Apple Silicon app ZIP
        run: npm run package:macos
      - name: Package the agent plugin and marketplace
        run: |
          python3 tools/package-agent-plugin.py --output target/agent-plugin-release
          cp target/agent-plugin-release/*.zip target/release/bundle/zip/
      - name: Verify bundle and checksum
        run: |
          codesign --verify --deep --strict target/release/bundle/macos/PulseDeck.app
          python3 tools/verify-release.py target/release/bundle/macos/PulseDeck.app
          cd target/release/bundle/zip
          shasum -a 256 *.zip > SHA256SUMS.txt
      - name: Test installed app from the ZIP
        run: |
          python3 - <<'PYTHON'
          import pathlib, subprocess, tempfile
          archive = next(pathlib.Path('target/release/bundle/zip').glob('PulseDeck_*.zip')).resolve()
          with tempfile.TemporaryDirectory(prefix='pulsedeck-zip-test-') as temporary:
              extracted = pathlib.Path(temporary).resolve()
              subprocess.run(['ditto', '-x', '-k', str(archive), str(extracted)], check=True)
              subprocess.run(['python3', 'tools/test-release.py', str(extracted / 'PulseDeck.app')], check=True)
          PYTHON
      - uses: actions/upload-artifact@v4
        with:
          name: PulseDeck-${{ env.RELEASE_TAG }}-${{ github.sha }}
          path: |
            target/release/bundle/zip/*.zip
            target/release/bundle/zip/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Publish or update downloadable release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: PulseDeck ${{ env.RELEASE_TAG }}
          body_path: .github/release-notes.md
          files: |
            target/release/bundle/zip/*.zip
            target/release/bundle/zip/SHA256SUMS.txt
          fail_on_unmatched_files: true
          overwrite_files: true
          draft: false
          prerelease: false
